services:
  mysql:
    image: mysql:8.4
    container_name: mmdbconnect-go-service-mysql
    restart: unless-stopped
    env_file:
      - .env.mysql
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  api:
    image: ghcr.io/mochammadbagas/mmdbconnect-go-service:latest
    container_name: mmdbconnect-go-service
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env.docker
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - backend

volumes:
  mysql_data:
  uploads_data:

networks:
  backend:
    driver: bridge
